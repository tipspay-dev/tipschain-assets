name: Release Pipeline

on:
  pull_request:
    paths:
      - "tokens/**"
  push:
    branches:
      - main
    paths:
      - "tokens/**"

permissions:
  contents: write

concurrency:
  group: tipschain-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate assets
        run: npm run validate

      - name: Build token list
        run: npm run build

      - name: Commit generated token list
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- tips-token-list.json; then
            echo "No token list changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tips-token-list.json
          git commit -m "chore: update token list [skip ci]"
          git push
